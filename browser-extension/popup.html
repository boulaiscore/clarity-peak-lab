<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LOOMA Focus Sensor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand"><span></span> LOOMA</div>
      <div class="status-row">
        <div>
          <p class="label">DESKTOP SENSOR</p>
          <h1 id="status">Active</h1>
        </div>
        <div id="indicator" class="indicator"></div>
      </div>
      <div class="stats">
        <div><span id="queued">0</span><small>READY TO SYNC</small></div>
        <div><span id="tracking">—</span><small>NOW</small></div>
      </div>
      <p class="privacy">Only aggregates leave this browser. Never URLs or content.</p>
      <button id="openLooma" type="button">Open LOOMA</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
